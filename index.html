<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f4f1">
<title>LINK CONTROL · Sales OS</title>
<style>
:root{--bg:#f5f5f2;--side:#ecece8;--card:#fff;--card2:#fafaf8;--line:#dfdfda;--ink:#202120;--muted:#74756f;--soft:#e9e9e4;--hover:#e4e4df;--accent:#111;--accentText:#fff;--green:#31905d;--amber:#b78427;--red:#c65d5d;--blue:#5d7fa8;--shadow:0 16px 44px rgba(0,0,0,.08)}
[data-theme=gray]{--bg:#d9d9d5;--side:#cececa;--card:#e8e8e4;--card2:#deded9;--line:#bdbdb8;--ink:#202120;--muted:#5e5f5b;--soft:#c8c8c3;--hover:#c1c1bc;--accent:#151515;--accentText:#fff}
[data-theme=dark]{--bg:#202120;--side:#181918;--card:#2a2b2a;--card2:#252625;--line:#3a3b39;--ink:#ededeb;--muted:#aaa;--soft:#333432;--hover:#30312f;--accent:#f0f0ee;--accentText:#1b1c1b;--green:#5bb982;--amber:#d9aa52;--red:#dd7a7a;--blue:#80a3cc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
.shell{min-height:100vh}.sidebar{width:260px;position:fixed;inset:0 auto 0 0;background:var(--side);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;z-index:30;transition:.22s ease}.collapsed .sidebar{width:68px}.collapsed .brandcopy,.collapsed .nav span,.collapsed .side-label,.collapsed .recent,.collapsed .new-client span,.collapsed .user-copy{display:none}.collapsed .new-client{justify-content:center}.main{margin-left:260px;min-height:100vh;transition:.22s ease}.collapsed .main{margin-left:68px}
.brand{height:46px;display:flex;align-items:center;gap:9px;padding:3px 6px 9px}.brandmark,.ai-avatar{background:var(--accent);color:var(--accentText);display:grid;place-items:center;font-weight:800;border-radius:9px}.brandmark{width:31px;height:31px}.brandcopy{line-height:1.08}.brandcopy b{font-size:12px;display:block}.brandcopy small{font-size:9px;color:var(--muted)}
.icon-btn,.text-btn{border:0;background:transparent;border-radius:8px;padding:7px 9px}.icon-btn:hover,.text-btn:hover{background:var(--hover)}.new-client{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 11px;text-align:left;font-weight:700;margin:3px 0 9px;display:flex;gap:8px;align-items:center}.nav{display:flex;flex-direction:column;gap:2px}.nav button{border:0;background:transparent;border-radius:8px;padding:9px 10px;text-align:left;display:flex;gap:10px;align-items:center}.nav button:hover,.nav button.active{background:var(--hover)}.nav i{width:20px;font-style:normal;color:var(--muted);text-align:center}.side-label{padding:18px 10px 7px;font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--muted)}.recent{overflow:auto}.recent button{border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left;display:flex;gap:9px;align-items:center;width:100%}.recent button:hover{background:var(--hover)}.dot{width:7px;height:7px;border-radius:50%;background:#999}.dot.hot{background:var(--amber)}.dot.active{background:var(--green)}
.userbox{margin-top:auto;border-top:1px solid var(--line);padding:11px 6px 2px;display:flex;align-items:center;gap:8px}.avatar{width:31px;height:31px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:10px;font-weight:800}.user-copy{flex:1}.user-copy b{display:block;font-size:11px}.user-copy small{color:var(--muted);font-size:9px}
.topbar{height:55px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.top-left,.top-right,.row,.actions{display:flex;align-items:center;gap:8px}.crumb{font-size:11px;font-weight:750}.status{font-size:9px;color:var(--muted);display:flex;gap:6px;align-items:center}.status i{width:7px;height:7px;border-radius:50%;background:var(--green)}.theme{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--card)}.theme button{border:0;width:24px;height:22px;border-radius:50%;background:transparent;font-size:0}.theme button.active{outline:1px solid var(--ink)}.theme .light{background:#fff}.theme .gray{background:#999}.theme .dark{background:#111}
.content{max-width:1380px;margin:auto;padding:30px 32px 120px}.eyebrow{font-size:9px;font-weight:800;letter-spacing:.11em;color:var(--muted);text-transform:uppercase;margin:0 0 7px}.hero{max-width:820px;margin:10px 0 24px}.hero h1{font-size:34px;line-height:1.08;letter-spacing:-.04em;margin:0 0 10px}.hero p{color:var(--muted);line-height:1.55}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.02)}.panel h2,.panel h3{margin:0 0 5px}.panel h2{font-size:18px;letter-spacing:-.02em}.muted{color:var(--muted);line-height:1.5}.metric strong{font-size:26px;letter-spacing:-.04em;display:block}.metric span{color:var(--muted);font-size:11px}.metric small{display:block;color:var(--muted);margin-top:7px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px;font-weight:700}.btn:hover{background:var(--hover)}.btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}
.badge{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:10px;color:var(--muted);background:var(--card2)}.score{font-weight:800}.score.hot{color:var(--green)}.score.warm{color:var(--amber)}.score.low{color:var(--muted)}
.pipeline{display:grid;grid-template-columns:repeat(8,minmax(170px,1fr));gap:8px;overflow:auto;padding-bottom:4px}.lane{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px;min-height:250px}.lane h4{margin:0 0 8px;font-size:10px;display:flex;justify-content:space-between}.opp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:7px 0;cursor:pointer}.opp:hover{box-shadow:var(--shadow);transform:translateY(-1px)}.opp b{display:block;font-size:12px}.opp small{display:block;color:var(--muted);margin-top:5px}.opp .mini{display:flex;justify-content:space-between;margin-top:9px;font-size:10px}
.list{display:flex;flex-direction:column;gap:7px}.list-item{display:flex;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}.list-item b{font-size:12px}.list-item small{color:var(--muted);display:block;margin-top:3px}.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:10px;outline:none}textarea{min-height:100px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--ink)}
.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line)}.table td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}.table tr:hover td{background:var(--card2)}
.drawer-backdrop,.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:.2s;z-index:50}.drawer,.modal{position:fixed;z-index:51;background:var(--card);border:1px solid var(--line);box-shadow:0 25px 80px rgba(0,0,0,.22);transition:.22s ease}.drawer{top:0;right:0;height:100vh;width:min(520px,96vw);transform:translateX(100%);padding:18px;overflow:auto}.drawer.open{transform:none}.drawer-backdrop.open,.modal-backdrop.open{opacity:1;pointer-events:auto}.modal{left:50%;top:50%;width:min(760px,94vw);max-height:90vh;overflow:auto;transform:translate(-50%,-46%) scale(.98);border-radius:16px;padding:20px;opacity:0;pointer-events:none}.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.drawer-head,.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}.close{border:0;background:transparent;font-size:22px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{border:0;background:transparent;padding:9px 11px;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.active{border-bottom-color:var(--ink);font-weight:800}
.ai{position:fixed;right:18px;bottom:18px;width:min(420px,calc(100vw - 36px));height:min(620px,calc(100vh - 90px));background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.2);z-index:45;display:flex;flex-direction:column;transform:translateY(115%);transition:.22s}.ai.open{transform:none}.ai-head{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}.ai-head .ai-avatar{width:29px;height:29px}.ai-head div{flex:1}.ai-head b{font-size:12px}.ai-head small{display:block;color:var(--muted);font-size:9px}.ai-body{padding:14px;overflow:auto;flex:1}.bubble{max-width:92%;padding:10px 11px;border-radius:12px;margin:7px 0;line-height:1.5;white-space:pre-wrap}.bubble.user{margin-left:auto;background:var(--accent);color:var(--accentText)}.bubble.assistant{background:var(--soft)}.ai-foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:7px}.ai-foot textarea{min-height:42px;height:42px;resize:none}.fab{position:fixed;right:18px;bottom:18px;z-index:44;width:48px;height:48px;border-radius:50%;border:1px solid var(--accent);background:var(--accent);color:var(--accentText);font-weight:900;box-shadow:var(--shadow)}.ai.open+.fab{display:none}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:100px;border:1px solid var(--line);border-radius:9px;background:var(--card2);padding:7px}.day b{font-size:10px}.event{margin-top:6px;padding:5px 6px;border-radius:7px;background:var(--soft);font-size:9px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.source{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card2)}.source b{font-size:11px}.source small{color:var(--muted);display:block;margin-top:4px}.memory{border-left:3px solid var(--ink);padding:9px 10px;background:var(--card2);border-radius:0 9px 9px 0}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:100;background:var(--accent);color:var(--accentText);padding:10px 14px;border-radius:9px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:900px){.sidebar{width:68px}.brandcopy,.nav span,.side-label,.recent,.new-client span,.user-copy{display:none}.new-client{justify-content:center}.main{margin-left:68px}.grid4,.grid3{grid-template-columns:repeat(2,1fr)}.pipeline{grid-template-columns:repeat(8,180px)}.content{padding:22px 16px 100px}}
@media(max-width:600px){.grid4,.grid3,.grid2,.form-grid{grid-template-columns:1fr}.hero h1{font-size:28px}.content{padding:18px 12px 90px}.topbar{padding:0 10px}}
</style>
</head>
<body>
<div id="app" class="shell">
<aside class="sidebar">
  <div class="brand"><button class="icon-btn" onclick="toggleSidebar()">☰</button><div class="brandmark">L</div><div class="brandcopy"><b>LINK CONTROL</b><small>SALES OS · v1</small></div></div>
  <button class="new-client" onclick="openProspectModal()"><b>＋</b><span>Nuevo prospecto</span></button>
  <nav class="nav" id="nav"></nav>
  <div class="side-label">CLIENTES RECIENTES</div><div class="recent" id="recent"></div>
  <div class="userbox"><div class="avatar" id="userAvatar">LD</div><div class="user-copy"><b id="userName">LINK DIGITAL</b><small id="userEmail">modo local</small></div><button class="icon-btn" onclick="openSettings()">⚙</button></div>
</aside>
<main class="main">
<header class="topbar"><div class="top-left"><button class="icon-btn" onclick="toggleSidebar()">☰</button><span class="crumb" id="crumb">Control</span></div><div class="top-right"><span class="status"><i></i><span id="systemStatus">Sales OS operativo</span></span><div class="theme"><button class="light" onclick="theme('light')">L</button><button class="gray" onclick="theme('gray')">G</button><button class="dark" onclick="theme('dark')">D</button></div><button class="btn small" onclick="toggleAI()">IA</button></div></header>
<section class="content" id="view"></section>
</main>
</div>

<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div><aside class="drawer" id="drawer"></aside>
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()"></div><section class="modal" id="modal"></section>
<div class="ai" id="ai"><div class="ai-head"><div class="ai-avatar">✦</div><div><b>LINK Intelligence</b><small id="aiContext">Inteligencia comercial conectada</small></div><button class="icon-btn" onclick="toggleAI()">×</button></div><div class="ai-body" id="aiBody"></div><div class="ai-foot"><textarea id="aiInput" placeholder="Pregunta sobre ventas, un cliente o el siguiente paso…"></textarea><button class="btn primary" onclick="askAI()">Enviar</button></div></div><button class="fab" onclick="toggleAI()">✦</button>
<div class="toast" id="toast"></div>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const STAGES=["Descubierto","Investigando","Preview","Contactado","Respondió","Reunión","Propuesta","Negociación","Ganado","Perdido"];
const PRODUCTS=[
 {name:"Diagnóstico comercial",price:0,kind:"diagnostic",objective:"Encontrar el cuello de botella comercial antes de construir.",steps:["Reunión inicial","Ordenar Business Master","Detectar cuello de botella","Presentar siguiente paso"]},
 {name:"Website Starter",price:100000,kind:"website",objective:"Publicar una presencia digital útil, responsive y con CTA.",steps:["Definir contenido mínimo","Construir front","Revisión responsive","Aprobación","Publicar"]},
 {name:"Website Pro",price:250000,kind:"website",objective:"Convertir presencia digital en un activo comercial completo.",steps:["Arquitectura","Diseño y desarrollo","Formulario/WhatsApp","Responsive","Aprobación y publicación"]},
 {name:"Web Comercial",price:600000,kind:"commercial",objective:"Ordenar catálogo, captación y solicitudes.",steps:["Arquitectura comercial","Catálogo","Captación","Seguimiento","Publicación"]},
 {name:"E-commerce",price:750000,kind:"commerce",objective:"Construir catálogo, carrito, checkout y flujo de compra.",steps:["Catálogo","Carrito","Checkout","Pagos","Prueba y publicación"]}
];
const defaultState={
 theme:localStorage.getItem("lc_theme")||"light",page:"Tablero",sidebar:false,selected:null,
 prospects:[],clients:[],opportunities:[],tasks:[],events:[],sources:[],memories:[],aiMessages:[],
 config:null,supabase:null,user:null,mode:"local",month:new Date()
};
let state=defaultState;
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid=p=>(p||"id")+"_"+crypto.randomUUID();
const money=n=>new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(Number(n)||0);
const dateFmt=x=>x?new Intl.DateTimeFormat("es-CL",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(x)):"—";
const toast=m=>{ $("toast").textContent=m;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200) };

const nav=[
 ["Tablero","⌂"],["Prospectos","◎"],["Pipeline","▦"],["Clientes","●"],["Producción","◇"],["Calendario","□"],["Inteligencia","✦"],["Conexiones","↗"],["Productos","▤"],["Configuración","⚙"]
];
function renderNav(){ $("nav").innerHTML=nav.map(([n,i])=>`<button class="${state.page===n?"active":""}" onclick="go('${n}')"><i>${i}</i><span>${n}</span></button>`).join(""); }
function renderRecent(){ $("recent").innerHTML=state.clients.slice(0,8).map(c=>`<button onclick="openClient('${c.id}')"><i class="dot active"></i><span>${esc(c.name)}</span></button>`).join("")||`<div style="padding:8px 10px;color:var(--muted);font-size:10px">Sin clientes todavía</div>`; }
function render(){ document.documentElement.dataset.theme=state.theme==="light"?"":state.theme; renderNav();renderRecent();$("crumb").textContent=state.page;const fn={Tablero:dashboard,Prospectos:prospectsPage,Pipeline:pipelinePage,Clientes:clientsPage,Producción:productionPage,Calendario:calendarPage,Inteligencia:intelligencePage,Conexiones:connectionsPage,Productos:productsPage,Configuración:settingsPage}[state.page]||dashboard;$("view").innerHTML=fn(); }
window.go=p=>{state.page=p;render()};window.theme=t=>{state.theme=t;localStorage.setItem("lc_theme",t);render()};window.toggleSidebar=()=>{$("app").classList.toggle("collapsed")};

function dashboard(){
 const hot=state.prospects.filter(x=>x.score>=70&&x.stage!=="Ganado"&&x.stage!=="Perdido").length;
 const active=state.opportunities.filter(x=>!["Ganado","Perdido"].includes(x.stage)).length;
 const due=state.tasks.filter(x=>x.status!=="hecha").sort((a,b)=>new Date(a.due_at||"9999")-new Date(b.due_at||"9999")).slice(0,5);
 const today=state.events.filter(e=>new Date(e.start_at||e.start).toDateString()===new Date().toDateString());
 return `<div class="hero"><p class="eyebrow">LINK DIGITAL · MAQUINARIA DE VENTAS</p><h1>Del prospecto al producto publicado.</h1><p>Una puerta de entrada — website — y una máquina completa detrás: prospección, diagnóstico, preview, cierre, producción, calendario, memoria e inteligencia.</p><div class="actions"><button class="btn primary" onclick="openProspectModal()">＋ Capturar comercio</button><button class="btn" onclick="go('Pipeline')">Abrir pipeline</button><button class="btn" onclick="toggleAI()">Consultar IA</button></div></div>
 <div class="grid4">
  <section class="panel metric"><p class="eyebrow">PROSPECTOS</p><strong>${state.prospects.length}</strong><span>${hot} con score caliente</span></section>
  <section class="panel metric"><p class="eyebrow">OPORTUNIDADES</p><strong>${active}</strong><span>en movimiento</span></section>
  <section class="panel metric"><p class="eyebrow">PIPELINE</p><strong>${money(state.opportunities.reduce((s,x)=>s+Number(x.value||0),0))}</strong><span>valor potencial</span></section>
  <section class="panel metric"><p class="eyebrow">HOY</p><strong>${today.length}</strong><span>acciones en calendario</span></section>
 </div>
 <div style="height:10px"></div>
 <div class="grid2">
  <section class="panel"><div class="panel-head row" style="justify-content:space-between"><div><p class="eyebrow">TABLERO CLAVE</p><h2>Qué debe avanzar</h2></div><button class="text-btn" onclick="go('Pipeline')">Ver todo →</button></div>${priorityBoard()}</section>
  <section class="panel"><div class="panel-head row" style="justify-content:space-between"><div><p class="eyebrow">PRÓXIMOS GESTOS</p><h2>Acciones y ventanas</h2></div><button class="text-btn" onclick="go('Calendario')">Workspace →</button></div><div class="list">${due.map(t=>`<div class="list-item"><div><b>${esc(t.title)}</b><small>${dateFmt(t.due_at)} · ${esc(t.priority||"media")}</small></div><button class="btn small" onclick="completeTask('${t.id}')">✓</button></div>`).join("")||`<div class="empty">No hay tareas pendientes.</div>`}</div></section>
 </div>
 <div style="height:10px"></div><section class="panel"><div class="panel-head row" style="justify-content:space-between"><div><p class="eyebrow">PRODUCT ENGINE</p><h2>Puerta de entrada → expansión</h2></div><button class="text-btn" onclick="go('Productos')">Ver productos →</button></div><div class="grid4">${PRODUCTS.slice(1).map(p=>`<div class="panel" style="background:var(--card2)"><p class="eyebrow">${p.kind}</p><h3>${p.name}</h3><strong>${money(p.price)}</strong><p class="muted">${p.objective}</p></div>`).join("")}</div></section>`;
}
function priorityBoard(){
 const arr=[...state.prospects].filter(x=>!["Ganado","Perdido"].includes(x.stage)).sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,5);
 return `<div class="list">${arr.map(p=>`<div class="list-item"><div><b>${esc(p.name)}</b><small>${esc(p.industry||"comercio")} · ${esc(p.stage)}</small></div><div class="row"><span class="score ${p.score>=70?"hot":p.score>=50?"warm":"low"}">${p.score||0}</span><button class="btn small" onclick="openProspect('${p.id}')">Abrir</button></div></div>`).join("")||`<div class="empty">Captura tu primer comercio. El tablero aparecerá aquí.</div>`}</div>`;
}

function prospectsPage(){
 return `<div class="hero"><p class="eyebrow">PROSPECT HUNTER</p><h1>Buscar negocios con una oportunidad evidente.</h1><p>Registra cómo venden hoy, puntúa la fricción y crea una Preview antes de contactar.</p><div class="actions"><button class="btn primary" onclick="openProspectModal()">＋ Nuevo prospecto</button><button class="btn" onclick="seedDemo()">Cargar demo</button></div></div>
 <section class="panel"><div class="row" style="justify-content:space-between;margin-bottom:12px"><input id="prospectSearch" placeholder="Buscar por negocio, ciudad, Instagram o industria…" oninput="filterProspects()"><select id="prospectFilter" onchange="filterProspects()" style="max-width:190px"><option value="">Todos</option>${STAGES.map(s=>`<option>${s}</option>`).join("")}</select></div><div id="prospectTable">${prospectTable(state.prospects)}</div></section>`;
}

function calendarPage(){
 const y=state.month.getFullYear(),m=state.month.getMonth();const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7;
 const cells=[];for(let i=0;i<start;i++)cells.push(`<div class="day"></div>`);for(let d=1;d<=days;d++){const ds=new Date(y,m,d);const ev=state.events.filter(e=>new Date(e.start_at||e.start).toDateString()===ds.toDateString());cells.push(`<div class="day"><b>${d}</b>${ev.map(e=>`<div class="event" title="${esc(e.title)}">${esc(e.title)}</div>`).join("")}</div>`)}
 return `<div class="hero"><p class="eyebrow">CALENDAR WORKSPACE</p><h1>El calendario es parte del tratamiento.</h1><p>Cliente → compromiso → gesto/paso → evento → recordatorio → cumplimiento.</p><div class="actions"><button class="btn" onclick="shiftMonth(-1)">←</button><button class="btn" onclick="goToday()">Hoy</button><button class="btn" onclick="shiftMonth(1)">→</button><button class="btn primary" onclick="openEventModal()">＋ Agendar gesto</button></div></div><section class="panel"><h2>${new Intl.DateTimeFormat("es-CL",{month:"long",year:"numeric"}).format(state.month)}</h2><div class="calendar" style="margin-top:12px">${["L","M","X","J","V","S","D"].map(x=>`<div class="eyebrow" style="padding:3px 7px">${x}</div>`).join("")}${cells.join("")}</div></section><div style="height:10px"></div><section class="panel"><p class="eyebrow">GESTOS SIN FECHA</p><div class="list">${state.opportunities.filter(o=>o.next_action&&!o.next_action_at).slice(0,12).map(o=>`<div class="list-item"><div><b>${esc(o.name)}</b><small>${esc(o.next_action)}</small></div><button class="btn small" onclick="openEventModal('${o.client_id||""}')">Agendar</button></div>`).join("")||`<div class="empty">No hay gestos sin fecha.</div>`}</div></section>`;
}
window.shiftMonth=n=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+n,1);render()};window.goToday=()=>{state.month=new Date();render()};

window.openProspectModal=()=>openModal(`<div class="modal-head"><div><p class="eyebrow">CAPTURA</p><h2>Nuevo prospecto</h2></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveProspect(event)"><div class="form-grid"><div class="field"><label>NEGOCIO</label><input name="name" required></div><div class="field"><label>CIUDAD</label><input name="city"></div><div class="field"><label>INSTAGRAM</label><input name="instagram"></div><div class="field"><label>WEB ACTUAL</label><input name="website"></div><div class="field"><label>CANAL DE VENTA</label><select name="sales_channel"><option>Instagram → WhatsApp</option><option>Instagram → DM</option><option>Marketplace</option><option>Web propia</option><option>Local → WhatsApp</option><option>Otro</option></select></div><div class="field"><label>INDUSTRIA</label><input name="industry" placeholder="ropa, gastronomía, belleza…"></div><div class="field"><label>TICKET ESTIMADO</label><input name="ticket" type="number"></div><div class="field"><label>SEGUIDORES / DEMANDA</label><input name="audience" type="number"></div><div class="field full"><label>FRICCIÓN OBSERVADA</label><textarea name="friction" placeholder="¿Qué tiene que hacer hoy el cliente para comprar?"></textarea></div></div><div class="actions" style="margin-top:12px"><button class="btn" type="button" onclick="closeModal()">Cancelar</button><button class="btn primary">Guardar y puntuar</button></div></form>`);
window.saveProspect=async e=>{e.preventDefault();const f=new FormData(e.target);const p={id:uid("pr"),name:f.get("name"),city:f.get("city"),instagram:f.get("instagram"),website:f.get("website"),sales_channel:f.get("sales_channel"),industry:f.get("industry"),ticket:Number(f.get("ticket")||0),audience:Number(f.get("audience")||0),friction:f.get("friction"),stage:"Descubierto",score:scoreProspect(Object.fromEntries(f)),next_action:"Investigar y construir Preview",created_at:new Date().toISOString(),updated_at:new Date().toISOString()};state.prospects.unshift(p);state.opportunities.push({...p,opportunity_id:p.id,value:recommendPrice(p),product:recommendProduct(p)});await persist("prospects",p);await persist("opportunities",state.opportunities[0]);closeModal();render();toast("Prospecto capturado y puntuado")};
function scoreProspect(p){let s=0;if(!p.website)s+=20;if(p.instagram)s+=15;if(p.sales_channel?.includes("WhatsApp"))s+=10;if(Number(p.audience)>1000)s+=15;if(Number(p.ticket)>=20000)s+=10;if(p.friction)s+=15;if(p.industry)s+=5;return Math.min(100,s)}
function recommendProduct(p){if(!p.website)return "Website Starter";if(p.sales_channel?.includes("Marketplace"))return "Web Comercial";return "Website Pro"}
function recommendPrice(p){return PRODUCTS.find(x=>x.name===recommendProduct(p))?.price||100000}

window.openProspect=id=>{const p=state.prospects.find(x=>x.id===id);if(!p)return;openDrawer(`<div class="drawer-head"><div><p class="eyebrow">OPPORTUNITY PREVIEW</p><h2>${esc(p.name)}</h2><span class="badge">${p.score||0}/100</span></div><button class="close" onclick="closeDrawer()">×</button></div>
<div class="panel"><p class="eyebrow">HIPÓTESIS</p><h3>${esc(p.friction||"Hay una oportunidad de ordenar la conversión.")}</h3><p class="muted">Canal actual: ${esc(p.sales_channel||"—")} · ${esc(p.website||"sin web")}</p></div>
<div style="height:10px"></div><div class="panel"><p class="eyebrow">PROPUESTA RECOMENDADA</p><h2>${esc(recommendProduct(p))}</h2><strong style="font-size:22px">${money(recommendPrice(p))}</strong><p class="muted">Construir una demostración específica para su forma de venta. La demo es conceptual y no oficial.</p><div class="actions"><button class="btn primary" onclick="createPreview('${p.id}')">Crear Preview</button><button class="btn" onclick="moveProspect('${p.id}','Contactado')">Marcar contactado</button></div></div>
<div style="height:10px"></div><div class="panel"><p class="eyebrow">PRÓXIMO GESTO</p><h3>${esc(p.next_action||"—")}</h3><button class="btn small" onclick="openEventModal('', '${p.id}')">Agendar gesto</button></div>`)}
window.moveProspect=async(id,stage)=>{const p=state.prospects.find(x=>x.id===id);if(!p)return;p.stage=stage;p.updated_at=new Date().toISOString();const o=state.opportunities.find(x=>x.id===id);if(o)o.stage=stage;await persist("prospects",p);await persist("opportunities",o);render();toast(`Movido a ${stage}`)}
window.createPreview=id=>{const p=state.prospects.find(x=>x.id===id);if(!p)return;openModal(`<div class="modal-head"><div><p class="eyebrow">PREVIEW STUDIO</p><h2>Propuesta para ${esc(p.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="panel"><p class="eyebrow">DEMOSTRACIÓN CONCEPTUAL · NO OFICIAL</p><h2>${esc(p.name)}</h2><p class="muted">Una portada diseñada alrededor de su forma de vender.</p><div class="panel" style="background:var(--soft);margin-top:10px"><h2>Compra con menos fricción.</h2><p>${esc(p.friction||"Catálogo, confianza y contacto en un solo lugar.")}</p><button class="btn primary">Ver productos / pedir ahora</button></div></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" onclick="moveProspect('${p.id}','Preview');closeModal()">Registrar Preview</button></div>`)}
function openOpportunity(id){const o=state.opportunities.find(x=>x.id===id);if(!o)return;openDrawer(`<div class="drawer-head"><div><p class="eyebrow">OPORTUNIDAD</p><h2>${esc(o.name)}</h2></div><button class="close" onclick="closeDrawer()">×</button></div><div class="panel"><p class="eyebrow">ETAPA</p><select onchange="moveOpportunity('${o.id}',this.value)">${STAGES.map(s=>`<option ${s===o.stage?"selected":""}>${s}</option>`).join("")}</select></div><div style="height:10px"></div><div class="panel"><p class="eyebrow">PRODUCTO</p><h2>${esc(o.product||"Website")}</h2><strong>${money(o.value)}</strong><p class="muted">Score ${o.score||0}. Próximo gesto: ${esc(o.next_action||"—")}</p><button class="btn primary" onclick="openEventModal('${o.client_id||""}','${o.id}')">Agendar siguiente gesto</button></div>`)}
window.moveOpportunity=async(id,stage)=>{const o=state.opportunities.find(x=>x.id===id);if(!o)return;o.stage=stage;o.updated_at=new Date().toISOString();const p=state.prospects.find(x=>x.id===id);if(p)p.stage=stage;if(stage==="Ganado"){const c={id:uid("cl"),name:o.name,industry:o.industry,status:"activo",next_action:"Onboarding",value:o.value,offer:o.product,created_at:new Date().toISOString()};state.clients.unshift(c);o.client_id=c.id;await persist("clients",c)}await persist("opportunities",o);if(p)await persist("prospects",p);closeDrawer();render();toast(`Oportunidad → ${stage}`)}

window.openSourceModal=id=>openModal(`<div class="modal-head"><div><p class="eyebrow">SOURCE MEMORY</p><h2>Agregar fuente</h2></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveSource(event)"><div class="form-grid"><div class="field"><label>TÍTULO</label><input name="title" required></div><div class="field"><label>URL</label><input name="source_url" placeholder="https://…"></div><div class="field"><label>TIPO</label><select name="kind"><option>website</option><option>catalog</option><option>meeting</option><option>proposal</option><option>note</option></select></div><div class="field full"><label>CONTENIDO</label><textarea name="content" required placeholder="Pega aquí el contenido relevante…"></textarea></div></div><button class="btn primary">Guardar fuente</button></form>`);
window.saveSource=async e=>{e.preventDefault();const f=new FormData(e.target);const r={id:uid("src"),client_id:state.selected,title:f.get("title"),source_url:f.get("source_url"),kind:f.get("kind"),content:f.get("content"),created_at:new Date().toISOString()};state.sources.unshift(r);await persist("client_sources",r);closeModal();render();toast("Fuente guardada en memoria")};
window.openMemoryModal=id=>openModal(`<div class="modal-head"><div><p class="eyebrow">MEMORIA OPERATIVA</p><h2>Registrar aprendizaje</h2></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveMemory(event)"><div class="field"><label>TÍTULO</label><input name="title" placeholder="Objeción, decisión, insight…" required></div><div class="field" style="margin-top:10px"><label>MEMORIA</label><textarea name="content" required></textarea></div><button class="btn primary" style="margin-top:10px">Guardar memoria</button></form>`);
window.saveMemory=async e=>{e.preventDefault();const f=new FormData(e.target);const r={id:uid("mem"),client_id:state.selected,title:f.get("title"),content:f.get("content"),kind:"insight",created_at:new Date().toISOString()};state.memories.unshift(r);await persist("client_memories",r);closeModal();render();toast("Memoria guardada")};

window.openEventModal=(clientId="",opportunityId="")=>openModal(`<div class="modal-head"><div><p class="eyebrow">GESTO → EVENTO</p><h2>Agendar acción</h2></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveEvent(event)"><div class="form-grid"><div class="field full"><label>TÍTULO</label><input name="title" required value="Siguiente gesto LINK"></div><div class="field"><label>CLIENTE</label><select name="client_id"><option value="">Sin cliente</option>${state.clients.map(c=>`<option value="${c.id}" ${c.id===clientId?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>FECHA / HORA</label><input name="start_at" type="datetime-local" required></div><div class="field full"><label>NOTAS</label><textarea name="notes" placeholder="Qué debe ocurrir para cerrar esta ventana…"></textarea></div></div><div class="actions" style="margin-top:12px"><button class="btn primary">Guardar gesto</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></form>`);
window.saveEvent=async e=>{e.preventDefault();const f=new FormData(e.target);const r={id:uid("ev"),client_id:f.get("client_id")||null,title:f.get("title"),start_at:new Date(f.get("start_at")).toISOString(),end_at:new Date(new Date(f.get("start_at")).getTime()+30*60000).toISOString(),status:"Programado",notes:f.get("notes"),created_at:new Date().toISOString()};state.events.push(r);await persist("calendar_events",r);try{const out=await fetch("/api/calendar-gateway",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"create",event:{title:r.title,start:r.start_at,end:r.end_at,description:r.notes,timezone:"America/Santiago",attendees:["linkdigitalatacama@gmail.com"]}})});if(out.ok){const d=await out.json();r.google_event_id=d.event?.id||null;r.google_html_link=d.event?.htmlLink||null;await persist("calendar_events",r)}}catch{}closeModal();render();toast("Gesto agendado")};

window.completeTask=async id=>{const t=state.tasks.find(x=>x.id===id);if(!t)return;t.status="hecha";await persist("tasks",t);render()};
window.toggleProtocolStep=async(id,i)=>{const o=state.opportunities.find(x=>x.id===id);if(!o)return;const p=PRODUCTS.find(x=>x.name===o.product)||PRODUCTS[1];let done=o.completed_steps||0;if(i<done)done=i;else if(i===done)done++;o.completed_steps=Math.min(done,p.steps.length);await persist("opportunities",o);render()};

function openModal(x){$("modal").innerHTML=x;$("modalBackdrop").classList.add("open");$("modal").classList.add("open")}window.openModal=openModal;window.closeModal=()=>{$("modal").classList.remove("open");$("modalBackdrop").classList.remove("open")};
function openDrawer(x){$("drawer").innerHTML=x;$("drawerBackdrop").classList.add("open");$("drawer").classList.add("open")}window.closeDrawer=()=>{$("drawer").classList.remove("open");$("drawerBackdrop").classList.remove("open")};
window.copyText=async x=>{await navigator.clipboard.writeText(x);toast("Copiado")};
window.toggleAI=()=>{$("ai").classList.toggle("open");if(!$("ai").classList.contains("open"))return;if(!$("aiBody").children.length){$("aiBody").innerHTML=`<div class="bubble assistant">Soy la inteligencia de LINK. Puedo ayudarte a decidir el siguiente gesto, analizar un prospecto o trabajar sobre la ficha 360 del cliente seleccionado.</div>`}};
window.askAI=async()=>{const input=$("aiInput"),q=input.value.trim();if(!q)return;input.value="";$("aiBody").insertAdjacentHTML("beforeend",`<div class="bubble user">${esc(q)}</div>`);const ctx=state.selected?state.clients.find(c=>c.id===state.selected):null;const context=ctx?JSON.stringify({client:ctx,memories:state.memories.filter(x=>x.client_id===ctx.id).slice(0,30),sources:state.sources.filter(x=>x.client_id===ctx.id).slice(0,30),opportunities:state.opportunities.filter(x=>x.client_id===ctx.id)}):JSON.stringify({prospects:state.prospects.slice(0,30),pipeline:state.opportunities.slice(0,30),tasks:state.tasks.slice(0,30)});try{const r=await fetch("/api/ai-gateway",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider:"openrouter",messages:[{role:"system",content:"Eres LINK Intelligence, el copiloto operativo de LINK DIGITAL. Usa sólo el contexto entregado. Si falta información dilo. Sé concreto, orientado a ventas y próximos gestos."},{role:"user",content:`CONTEXTO:${context}\nPREGUNTA:${q}`} ]})});const d=await r.json();$("aiBody").insertAdjacentHTML("beforeend",`<div class="bubble assistant">${esc(d.content||d.error||"Sin respuesta")}</div>`)}catch(e){$("aiBody").insertAdjacentHTML("beforeend",`<div class="bubble assistant">No pude conectar con el gateway de IA. Revisa OPENROUTER_API_KEY en Vercel.</div>`)}$("aiBody").scrollTop=$("aiBody").scrollHeight};

async function loadConfig(){try{const r=await fetch("/api/config");state.config=await r.json();if(state.config.supabaseUrl&&state.config.supabasePublishableKey){state.supabase=createClient(state.config.supabaseUrl,state.config.supabasePublishableKey);const {data}=await state.supabase.auth.getSession();state.user=data.session?.user||null;state.mode=state.user?"supabase":"supabase-auth-ready";if(state.user)await loadSupabase();state.supabase.auth.onAuthStateChange((_e,s)=>{state.user=s?.user||null;state.mode=state.user?"supabase":"supabase-auth-ready";if(state.user)loadSupabase();render()})}}catch(e){state.mode="local"}}
async function loadSupabase(){if(!state.supabase)return;const tables=["prospects","clients","opportunities","tasks","calendar_events","client_sources","client_memories"];for(const t of tables){try{const {data,error}=await state.supabase.from(t).select("*").order("created_at",{ascending:false}).limit(500);if(error)continue;const key=t==="client_sources"?"sources":t==="client_memories"?"memories":t;state[key]=data||[]}catch{}}render()}
async function persist(table,row){if(!state.supabase||!state.user){localStorage.setItem("lc_sales_"+table,JSON.stringify(state[table==="client_sources"?"sources":table==="client_memories"?"memories":table]||[]));return}try{const {error}=await state.supabase.from(table).upsert(row);if(error)throw error}catch(e){console.warn(table,e)}}
window.login=async()=>{if(!state.supabase)return toast("Configura Supabase primero");const {error}=await state.supabase.auth.signInWithPassword({email:$("loginEmail").value,password:$("loginPass").value});if(error)toast(error.message);else toast("Sesión iniciada")};
window.signup=async()=>{if(!state.supabase)return toast("Configura Supabase primero");const {error}=await state.supabase.auth.signUp({email:$("loginEmail").value,password:$("loginPass").value});if(error)toast(error.message);else toast("Cuenta creada. Revisa tu correo si Supabase exige confirmación.")};
window.logout=async()=>{await state.supabase?.auth.signOut();state.user=null;state.mode="local";render()};
function loadLocal(){for(const t of ["prospects","clients","opportunities","tasks","calendar_events","client_sources","client_memories"]){try{const d=JSON.parse(localStorage.getItem("lc_sales_"+t)||"null");if(d){const k=t==="client_sources"?"sources":t==="client_memories"?"memories":t;state[k]=d}}catch{}}}
window.seedDemo=()=>{const p={id:uid("pr"),name:"Tienda Demo Atacama",city:"Copiapó",instagram:"@tiendademo",website:"",sales_channel:"Instagram → WhatsApp",industry:"retail",ticket:35000,audience:6200,friction:"El cliente debe preguntar por precio, stock y despacho por DM/WhatsApp.",stage:"Investigando",score:90,next_action:"Construir Preview específico",created_at:new Date().toISOString(),updated_at:new Date().toISOString()};state.prospects=[p,...state.prospects];state.opportunities=[{...p,product:"Website Starter",value:100000,opportunity_id:p.id},...state.opportunities];render();toast("Demo cargada")};

loadLocal();loadConfig();render();
</script>
</body>
