<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINK CONTROL · Sales OS</title></head><body><div id="boot">Cargando LINK CONTROL…</div><script>
(async()=>{
  try{
    const r=await fetch('/index.html',{cache:'no-store'});
    if(!r.ok) throw new Error('No se pudo cargar Sales OS ('+r.status+')');
    let html=await r.text();
    const addon='<script src="/mission-link.js?v=1"><\\/script>';
    if(!html.includes('/mission-link.js')) html=html.replace(/<\\/body>/i,addon+'</body>');
    document.open(); document.write(html); document.close();
  }catch(e){document.getElementById('boot').textContent='LINK CONTROL no pudo iniciar: '+e.message;}
})();
</script></body></html>
